name: Post Instagram story

# Every hour (at :07) it checks for a new post that has not had its story yet
# and shares it. Three times a day it also re-shares an older post.
# Cron is UTC: 05:30 / 10:30 / 15:30 UTC = 11:00 / 16:00 / 21:00 IST.
on:
  schedule:
    - cron: "7 * * * *"     # hourly: new posts -> story
    - cron: "30 5 * * *"    # 11:00 IST rotation
    - cron: "30 10 * * *"   # 16:00 IST rotation
    - cron: "30 15 * * *"   # 21:00 IST rotation
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything except the final publish"
        type: boolean
        default: true
      mode:
        description: "new = share posts without a story yet, rotate = re-share an older post"
        type: choice
        options: [new, rotate]
        default: new

# Two slots must never touch the rotation state or gh-pages at the same time.
concurrency:
  group: gamians-story-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure ffmpeg
        run: |
          # ffmpeg is no longer preinstalled on the ubuntu-24.04 runner image.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg is not on this runner image - installing it."
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          # No pipe here: a pipeline would return head's exit code, not ffmpeg's,
          # which is exactly how the missing binary slipped through before.
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Post story
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '7 * * * *' && 'new' || 'rotate') }}
        run: python scripts/run_story.py --mode "$MODE" --slot "${{ github.event.schedule || 'manual' }}"

      - name: Save rotation state
        if: success()
        run: |
          if [[ -n "$(git status --porcelain state/history.json)" ]]; then
            git config user.name  "gamians-story-bot"
            git config user.email "gamians-story-bot@users.noreply.github.com"
            git add state/history.json
            git commit -m "rotation: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another slot may have pushed while this one was encoding.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
              sleep $((i * 5))
            done
            echo "::warning::Could not push rotation state after 3 attempts."
          else
            echo "No rotation change to commit."
          fi
